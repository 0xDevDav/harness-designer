name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and a push that arrives mid-run wins: what ends up
# published is always the newest main, never an older build finishing late.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # see the comment in ci.yml: the lock is written on Windows and npm ci
      # refuses it on Linux
      - run: npm install --no-audit --no-fund

      # the same gates as the CI: nothing reaches the public URL without them
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
