name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # npm install and not npm ci: the lock is written on Windows, where npm
      # does not resolve the wasm variant of the bundler that Linux picks up,
      # so a clean install would refuse a lock it considers out of sync
      - run: npm install --no-audit --no-fund

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      # both distributions are built: the single-file one uses a different config
      - run: npm run build
      - run: npm run build:standalone
